name: SciLitAI Daily Digest

on:
  schedule:
    # 07:00 America/Sao_Paulo = 10:00 UTC under the current UTC-03 offset.
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scilitai-daily-digest
  cancel-in-progress: false

jobs:
  digest:
    name: Generate and send digest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_MODEL: gemini-3.8-flash
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate Python sources
        run: python -m compileall -q sciml_digest tests

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run Daily SciML Digest
        run: python -m sciml_digest.main
